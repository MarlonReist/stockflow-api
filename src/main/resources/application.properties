spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:3306/stockflow
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:1234}

stockflow.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

stockflow.jwt.secret=${JWT_SECRET:stockflow-chave-secreta-desenvolvimento-com-pelo-menos-32-caracteres}
stockflow.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
stockflow.mail.from=stockflowapi@gmail.com
stockflow.frontend.url=${FRONTEND_URL:http://localhost:5173}

stockflow.convite.cooldown-minutos=5
